<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff8fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/paperjump-icon.png?v=11" type="image/png">
  <link rel="apple-touch-icon" href="icons/paperjump-icon.png?v=11">
  <link rel="stylesheet" href="styles.css?v=11">
  <title>Paper Portal</title>
</head>
<body>
  <header>
    <div class="brand">
      <img src="icons/paperjump-icon.png" alt="Paper Portal">
      <div><h1>Paper Portal</h1><p>让纸张，通往你的数字世界</p></div>
    </div>
    <span id="status">准备就绪</span>
  </header>
  <main>
    <section class="viewer">
      <video id="camera" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div class="camera-badge"><i></i> 实时识别</div>
      <p id="hint">轻触下方按钮开始扫描，将带有四个角标的纸张完整放入画面。</p>
    </section>
    <section class="actions">
      <button id="start">◉&ensp;开始扫描</button>
      <button id="stop" class="secondary" disabled>停止</button>
    </section>
    <section class="mode-bar">
      <label>识别模式
        <select id="page-mode">
          <option value="aruco">ArUco 四角纸</option>
          <option value="natural">Natural 普通纸</option>
        </select>
      </label>
      <button id="natural-scan" class="secondary" hidden disabled>自动识别普通纸</button>
    </section>
    <section class="panel">
      <div class="panel-heading">
        <div><small>识别结果</small><h2 id="page-title">当前页面节点</h2></div>
        <button id="add-node" class="mini" disabled>＋ 新增节点</button>
      </div>
      <div id="nodes"></div>
    </section>
    <section id="node-editor" class="node-editor" hidden>
      <div class="editor-card">
        <div class="editor-title"><h2>新增链接节点</h2><button id="close-editor" class="close" aria-label="关闭">×</button></div>
        <label>节点名称<input id="node-name" type="text" placeholder="例如：这条小红书笔记"></label>
        <label>粘贴链接<input id="node-url" type="url" inputmode="url" placeholder="https://..."></label>
        <p id="editor-help">填写后，点击“下一步”并在纸面画面上点一下节点位置。</p>
        <button id="pick-position">下一步：选择纸面位置</button>
      </div>
    </section>
    <details class="settings">
      <summary>数据设置</summary>
      <p>需要同步电脑上的页面或节点时，再从这里导入。</p>
      <div class="import-grid">
        <label>导入页面数据 <input id="pages-file" type="file" accept="application/json,.json"></label>
        <label>导入节点数据 <input id="nodes-file" type="file" accept="application/json,.json"></label>
        <label>导入 Natural 私人特征包 <input id="natural-file" type="file" accept="application/json,.json"></label>
      </div>
    </details>
  </main>
  <footer>Paper Portal · 触碰纸面，抵达记忆</footer>
  <script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/cv.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/aruco.js"></script>
  <script type="module" src="app.js?v=11"></script>
</body>
</html>
